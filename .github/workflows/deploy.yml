name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without pushing.
  workflow_dispatch:

# Least privilege: the build only reads the repo; only the deploy job
# gets to write to Pages, via the OIDC id-token.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy halfway - an interrupted Pages deployment can
# leave the site serving a mix of old and new files.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # GITHUB_ACTIONS is set automatically by the runner, which switches
      # vite.config.js to base '/Game4Ep/' so every asset and audio path
      # resolves under https://veryebet22.github.io/Game4Ep/
      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
